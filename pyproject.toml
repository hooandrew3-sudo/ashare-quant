[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.2.0"
description = "A股多因子概率决策系统 · 生产级可执行版"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
model = ["lightgbm>=4.0"]
data = ["baostock>=0.8.8", "akshare>=1.12", "tushare>=1.4"]
report = ["matplotlib>=3.7"]
monitor = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ashare-quant = "quant.cli:main"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
