# A股多因子概率决策系统默认配置（可哈希存档）
run:
  seed: 42
  verbose: true

data:
  source: synthetic            # synthetic | baostock | parquet
  root: data
  benchmark: "000906.SH"       # 中证800
  universe:
    min_avg_amount: 50000000   # 日均成交额下限（元）
    exclude_st: true
    min_list_days: 60
  demo:
    n_stocks: 200
    years: 4
    start: "2021-01-01"

factors:
  top_n: 10                    # 参与建模的因子数（按 IC 准入）
  min_ic: 0.03                 # 准入 Rank IC 阈值
  min_icir: 0.3                # 准入 ICIR 阈值
  min_t_stat: 2.0              # 准入 t 值阈值（显著性检验）
  winsor: 0.05                 # 去极值分位
  neutralize_industry: true    # 行业中性化
  neutralize_size: true        # 规模(成交额)中性化（Barra 风格）
  composite: true              # 生成复合因子（提升 ICIR）
  composite_n: 5               # 复合因子成分数
  composite_corr_max: 0.6      # 成分相关性上限（去冗余）
  composite_require_decay: true # 成分需衰减稳定（5/20 日同号）
  composite_weight: icir        # 复合权重：icir | t | equal
  # 因子健康度哨兵：连续 N 日原始覆盖度低于阈值时告警（防数据源失效导致因子静默退化）
  coverage_watch: ["consensus_revision"]
  coverage_min_ratio: 0.3
  coverage_min_days: 5

model:
  name: auto                   # lightgbm | gbt | auto
  horizon: 20                  # 预测未来20交易日
  horizons: [20]               # 多周期标签集成（如 [5, 10, 20, 40]）
  n_seeds: 1                   # 多种子集成数量（≥2 时启用种子平均）
  seeds: [42, 2024, 7]
  label_mode: binary           # binary(是否跑赢基准) | top_quantile
  top_quantile: 0.3
  train_years: 3
  test_months: 6
  n_splits: 5
  # 模型上线门禁（默认口径：ML 层无增量不设 AUC/IC 门槛，复合因子 t≥5 为硬门槛）
  gate_enabled: true
  gate_min_auc: 0.0
  gate_min_rank_ic: 0.0
  gate_min_composite_t: 5.0
  gate_min_folds: 5
  gate_block_on_fail: true
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8
  gbt_params:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3

portfolio:
  top_n: 30
  max_weight: 0.05
  max_industry: 0.25
  target_vol: 0.10             # 年化目标波动
  vol_window: 20
  cash_rate: 0.02
  turnover_cap: 0.40           # 单期最大替换比例
  stickiness: 0.80             # 旧持仓分数折扣
  stop_loss: 0.12
  band: 0.15                   # 目标权重偏差带（<15% 不调仓，降换手）
  exposure_step: 0.25          # 仓位状态机每期最大变动幅度（平滑调仓）
  min_overlap: 0.85            # 新组合与持仓重叠≥85% 时跳过调仓（抗噪声）
  rebalance_freq: M            # 调仓频率：M=月度 2M=双月 Q=季度
  beta_target: 0.5             # 滚动 beta 目标（低 beta 时提高暴露）
  beta_window: 60
  beta_scale_max: 1.5
  regime:
    fast: 20
    slow: 120
    long: 250
    levels: [1.0, 0.5, 0.3]

backtest:
  start: "2022-01-01"
  end: "2024-12-31"
  initial_cash: 1000000
  commission_bp: 2.5
  stamp_bp: 5.0
  transfer_bp: 0.1
  slippage_bp: 5.0
  min_commission: 5.0
  lot_size: 100
  postpone_max_days: 5

stress:
  scenarios:
    crash_2015: ["2015-06-15", "2015-09-30"]
    bear_2018: ["2018-01-01", "2018-12-31"]
    smallcap_2024: ["2024-01-01", "2024-02-29"]
    rally_2024: ["2024-09-24", "2025-02-28"]

report:
  output_dir: artifacts/reports
  title: "A股多因子概率决策系统 · 回测报告"
