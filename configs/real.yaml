# 真实数据（CSI800）回测配置
data:
  source: parquet            # 先同步（--source baostock --universe csi800 --step sync）再回测
  root: data
  benchmark: "000906.SH"
  sync:
    universe: csi800
    start: "2021-01-01"
    end: ""
    incremental: true

factors:
  composite_weight: t          # 同类对照结论：t 加权 + 无衰减约束优于 icir+衰减约束
  composite_require_decay: false

model:
  name: auto
  n_splits: 5
  horizons: [5, 10, 20, 40]
  n_seeds: 3
  label_mode: binary              # binary | quantile_contrast | regression（对比标签试验为负结果）
  params:
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8

portfolio:
  top_n: 30
  target_vol: 0.10
  stickiness: 0.90
  band: 0.15
  exposure_step: 0.25
  turnover_cap: 0.30
  min_overlap: 0.85
  rebalance_freq: Q
  beta_target: 0.5
  beta_window: 60
  beta_scale_max: 1.0   # 试验结论：放大 beta 拖累 IR/回撤，默认禁用

backtest:
  start: "2024-02-01"
  end: "2026-07-31"
  initial_cash: 1000000

report:
  title: "A股多因子概率决策系统 · 真实数据回测报告（CSI800）"
