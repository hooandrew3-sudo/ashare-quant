# 长窗口回测（2018 起）：Walk-Forward 折数提高到 15，样本外覆盖约 2019-02 ~ 2026-08。
# 注意：宇宙仍是「中证800 当前成分 + 2021 后退市股」，2018-2020 存在幸存者偏差（见报告）。
data:
  source: parquet
  root: data
  benchmark: "000906.SH"
  sync:
    universe: csi800_delisted
    start: "2018-01-01"
    end: ""
    incremental: true

factors:
  composite_weight: t
  composite_require_decay: false

model:
  name: auto
  n_splits: 15
  horizons: [5, 10, 20, 40]
  n_seeds: 3
  label_mode: binary
  params:
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8

portfolio:
  top_n: 30
  target_vol: 0.10
  stickiness: 0.90
  band: 0.15
  exposure_step: 0.25
  turnover_cap: 0.30
  min_overlap: 0.85
  rebalance_freq: Q
  beta_target: 0.5
  beta_window: 60
  beta_scale_max: 1.0
  # 负结果：A/B 实测（ON vs OFF）年化 22.99% vs 24.62%、IR 0.868 vs 0.939，
  # 回撤仅从 -9.85% 微降到 -9.44%，Sharpe/Calmar 反而更差——纯降收益的降险，不启用。
  signal_health_enabled: false
  signal_health_window: 126
  signal_health_floor: 0.5
  signal_health_scale: 0.10

backtest:
  start: "2018-01-01"
  end: "2026-12-31"
  initial_cash: 1000000

stress:
  scenarios:
    bear_2018: ["2018-01-01", "2018-12-31"]
    bear_2022: ["2022-01-01", "2022-12-31"]
    smallcap_2024: ["2024-01-01", "2024-02-29"]
    rally_2024: ["2024-09-24", "2025-02-28"]

report:
  title: "A股多因子概率决策系统 · 长窗口回测报告（2018起）"
